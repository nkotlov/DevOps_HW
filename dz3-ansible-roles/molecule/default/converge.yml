---
- name: Converge
  hosts: all
  become: true

  vars:
    managed_users:
      - name: moleculeuser
        group: moleculeuser
        shell: /bin/bash
        public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL6ipUTCLrQ/Z7JOsxSuI9sEkBS+wY/biaBSOSVYNilF roleuser-key"
        opt_dir: /opt/moleculeuser_workdir
        sudo_nopasswd: true

    ssh_password_authentication: "no"
    ssh_kbd_interactive_authentication: "no"
    ssh_restart_service: false
    ssh_service_name: ssh

  roles:
    - user_management
    - ssh_hardening